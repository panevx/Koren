name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main, 'claude/web-app-v0-2-pj7074']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Site is served from https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
          # The public demo shows draft missions (marked "Draft") so the team can test them.
          VITE_SHOW_DRAFTS: "1"

      - name: Publish dist/ to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
