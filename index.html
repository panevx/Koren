<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B6B3E" />
    <meta name="description" content="KOREN — Далеч от България. Близо до корените си." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png" />
    <title>KOREN</title>
    <script>
      // Starts downloading the biggest picture of the first screen right away, before the app code arrives
      // (it would otherwise be found only after ~100 KB of JavaScript has loaded and run).
      // Must match the srcset/sizes of <Heroes> (Brand.tsx) and the hub header (Home.tsx).
      ;(function () {
        try {
          if (document.querySelector('link[rel="preload"][as="image"]')) return // added at build time (home.html)
          var base = document.querySelector('link[rel="icon"]').href.replace(/favicon\.svg$/, '')
          var root = new URL(base).pathname.replace(/\/$/, '').toLowerCase()
          var path = location.pathname.replace(/\/$/, '').toLowerCase()
          var onboarded = /"onboarded":true/.test(localStorage.getItem('koren:settings') || '')
          var set
          if (path === root + '/home' || (path === root && onboarded))
            set = ['scenes/header-520.webp 520w', 'scenes/header-720.webp 720w', '(max-width: 448px) 100vw, 448px']
          else if (path === root) set = ['heroes/koren-raya-512.webp 512w', 'heroes/koren-raya-768.webp 768w', '(max-width: 448px) 90vw, 384px']
          if (!set) return
          var link = document.createElement('link')
          link.rel = 'preload'
          link.as = 'image'
          link.setAttribute('imagesrcset', base + 'img/' + set[0] + ', ' + base + 'img/' + set[1])
          link.setAttribute('imagesizes', set[2])
          link.setAttribute('fetchpriority', 'high')
          document.head.appendChild(link)
        } catch (e) {}
      })()
    </script>
    <style>
      /* Splash shown before React mounts. The app replaces #root's content. */
      body { margin: 0; background: #fbf7f0; }
      .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px; padding: 24px; box-sizing: border-box; text-align: center; color: #1f2a24;
        font: 600 16px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .boot b { font-size: 40px; font-weight: 900; color: #0b6b3e; letter-spacing: -1px; }
      .boot-error { display: none; max-width: 340px; background: #fff; border: 2px solid #c62828;
        border-radius: 16px; padding: 14px 16px; }
      .boot.failed .boot-loading { display: none; }
      .boot.failed .boot-error { display: block; }
    </style>
  </head>
  <body>
    <!--
      Static text here is the one allowed exception to the i18n rule:
      it must work before (or without) JavaScript, so it is bilingual.
    -->
    <div id="root">
      <div class="boot" id="boot">
        <b>KOREN</b>
        <span class="boot-loading">Зареждане… · Loading…</span>
        <div class="boot-error" role="alert">
          <p>Приложението не успя да се зареди. Опитай да презаредиш страницата.</p>
          <p>The app could not load. Please reload the page.</p>
          <p style="font-size:13px;color:#5b665f">
            GitHub Pages: Settings → Pages → Deploy from a branch → <code>gh-pages</code> / root
          </p>
        </div>
      </div>
    </div>
    <script>
      // If the app has not started within 8 s (script missing, old browser, wrong Pages branch),
      // show a readable message instead of a blank or endless loading screen.
      setTimeout(function () {
        if (!window.__korenStarted) {
          var el = document.getElementById('boot')
          if (el) el.className += ' failed'
        }
      }, 8000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
