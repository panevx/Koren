<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B6B3E" />
    <meta name="description" content="KOREN — Далеч от България. Близо до корените си." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png" />
    <title>KOREN</title>
    <style>
      /* Splash shown before React mounts. The app replaces #root's content. */
      body { margin: 0; background: #fbf7f0; }
      .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px; padding: 24px; box-sizing: border-box; text-align: center; color: #1f2a24;
        font: 600 16px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .boot b { font-size: 40px; font-weight: 900; color: #0b6b3e; letter-spacing: -1px; }
      .boot-error { display: none; max-width: 340px; background: #fff; border: 2px solid #c62828;
        border-radius: 16px; padding: 14px 16px; }
      .boot.failed .boot-loading { display: none; }
      .boot.failed .boot-error { display: block; }
    </style>
  </head>
  <body>
    <!--
      Static text here is the one allowed exception to the i18n rule:
      it must work before (or without) JavaScript, so it is bilingual.
    -->
    <div id="root">
      <div class="boot" id="boot">
        <b>KOREN</b>
        <span class="boot-loading">Зареждане… · Loading…</span>
        <div class="boot-error" role="alert">
          <p>Приложението не успя да се зареди. Опитай да презаредиш страницата.</p>
          <p>The app could not load. Please reload the page.</p>
          <p style="font-size:13px;color:#5b665f">
            GitHub Pages: Settings → Pages → Deploy from a branch → <code>gh-pages</code> / root
          </p>
        </div>
      </div>
    </div>
    <script>
      // If the app has not started within 8 s (script missing, old browser, wrong Pages branch),
      // show a readable message instead of a blank or endless loading screen.
      setTimeout(function () {
        if (!window.__korenStarted) {
          var el = document.getElementById('boot')
          if (el) el.className += ' failed'
        }
      }, 8000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
